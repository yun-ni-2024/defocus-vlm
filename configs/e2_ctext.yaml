# E2 with the text-loss adapter: test photographs deconvolved by the filter trained by configs/train_e2_ctext.yaml
# through the VLM with the adapter of configs/c_real_text.yaml (iteration 2000, best validation accuracy 0.872),
# then read by Qwen2-VL-2B with that adapter. Everything except `name` and `restore.params` is as in e_cd_text.yaml.
name: e2_ctext

model:
  path: models/Qwen2-VL-2B-Instruct   # relative to DEFOCUS_ROOT
  dtype: bfloat16
  min_pixels: 50176                   # 64 * 28 * 28
  max_pixels: 351232                  # 448 * 28 * 28
  max_new_tokens: 48
  prompt: "Transcribe the text in this image exactly as written. Output only the text, one line per line of text."
  lora: runs/train_c_real_text_8k_20261127-060912/adapters/it6000   # slot 2, relative to DEFOCUS_ROOT (as in c_real_text.yaml)

restore:                              # slot 1: the trained filter (src/restore/learned_wiener.py)
  name: learned_wiener
  params: assets/e2_ctext/params.json      # chosen checkpoint, copied from runs/train_e2_ctext_<time>/params/it2000.json; relative to the repository
  radius: estimated
  estimator: psf_backup               # radius estimator: src/<estimator>.estimate_radius
  radius_cache: cache/radii_test_psf_backup.json   # from scripts/estimate_radii.py, relative to DEFOCUS_ROOT
  device: cuda

image:
  white_percentile: 99.5              # this percentile is scaled to white
  long_side: 1024                     # downscale before the processor

data:
  split: test
  camera: blurred                     # "blurred" for (a); "sharp" gives the in-focus reference
  steps: null                         # null = all 20 steps
  limit_per_step: null                # null = all 40 images per step

batch_size: 8
keep_whitespace: false                # all spaces and line breaks are ignored when scoring
