# E1, the text loss: train a new LoRA adapter for the vision encoder of Qwen2-VL-2B on the
# output of the fixed (d) filter (slot 1) instead of the blurred photographs. Everything except
# `name`, `restore` and `train.workers` is as in train_c_real_text_8k.yaml, so a difference comes
# from the input. Read by scripts/train_lora.py; validation reads through the same filter.
name: train_e1_ctext

model:
  path: models/Qwen2-VL-2B-Instruct   # relative to DEFOCUS_ROOT
  dtype: bfloat16
  min_pixels: 50176                   # 64 * 28 * 28
  max_pixels: 351232                  # 448 * 28 * 28
  max_new_tokens: 48                  # used when reading the validation images
  prompt: "Transcribe the text in this image exactly as written. Output only the text, one line per line of text."

image:
  white_percentile: 99.5              # this percentile is scaled to white
  long_side: 1024                     # downscale before the processor

restore:                              # slot 1, fixed: the (d) filter (as in d_text.yaml), applied before to_pil()
  name: learned_wiener
  params: assets/d_text/params.json   # relative to the repository
  radius: estimated
  estimator: psf_backup               # radius estimator: src/<estimator>.estimate_radius
  radius_cache: cache/radii_train_psf_backup.json   # training photographs, relative to DEFOCUS_ROOT
  device: cpu                         # runs in the loading processes, which cannot use the GPU

data:
  source: real                        # real training pairs; "simulated" for (c) simulated
  steps: null                         # null = all 20 steps
  val_every: 10                       # samples whose number is a multiple of this are held out (20 per step)

lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]   # in all 32 blocks; the token merger stays frozen

loss: text                            # cross-entropy of the correct text, VLM with the adapter reading the blurred photo

train:
  learning_rate: 3.0e-4               # AdamW; best of 1e-4, 3e-4, 1e-3 at 3000 iterations (1e-3 diverged)
  batch_size: 2                       # image pairs per iteration; 4 does not fit on an RTX A4500 (2 uses 13 GB)
  iterations: 8000                    # as the chosen run of method (c) with feature distillation; at 3000 the accuracy was still rising
  warmup: 200                         # iterations of linear learning-rate warm-up
  seed: 0
  workers: 8                          # processes loading images; each also runs the (d) filter on the CPU

validation:
  every: 500                          # iterations between validation runs
  batch_size: 8                       # images per VLM call when reading
